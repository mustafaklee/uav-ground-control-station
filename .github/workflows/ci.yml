name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore Gcs.slnx

      - name: Build
        run: dotnet build Gcs.slnx --configuration $CONFIGURATION --no-restore

      - name: Unit tests
        run: dotnet test --project tests/Gcs.UnitTests --configuration $CONFIGURATION --no-build

      - name: Architecture tests
        run: dotnet test --project tests/Gcs.ArchitectureTests --configuration $CONFIGURATION --no-build

      # Testcontainers starts real PostgreSQL and RabbitMQ containers on the runner's Docker engine.
      - name: Integration tests
        run: dotnet test --project tests/Gcs.IntegrationTests --configuration $CONFIGURATION --no-build

  docker:
    name: Docker build and compose smoke test
    runs-on: ubuntu-24.04
    needs: build-and-test
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Gcs.Api.Dockerfile
          tags: gcs-api:local
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start stack and wait until healthy
        run: docker compose up --detach --wait --wait-timeout 180 --no-build

      - name: Check readiness endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:8080/health/ready

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes
