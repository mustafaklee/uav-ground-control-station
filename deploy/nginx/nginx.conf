# Nginx in front of the GCS API (Phase 11): TLS termination, WebSocket upgrade for SignalR, a first rate limit.
# The server blocks are in templates/gcs.conf.template (rendered with GCS_DOMAIN when the container starts).

worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off; # no version number in headers and error pages
    sendfile      on;
    keepalive_timeout 65s;

    # The correlation id: the client's X-Correlation-ID when it sent one, else a fresh one from Nginx. It goes to the
    # API (which uses it in its log and trace) and into this log, so one id finds a request everywhere.
    map $http_x_correlation_id $gcs_correlation_id {
        default $http_x_correlation_id;
        ''      $request_id;
    }

    # One line per request, with the time the API took.
    log_format gcs '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent '
                   'rt=$request_time upstream=$upstream_response_time id=$gcs_correlation_id ua="$http_user_agent"';
    access_log /dev/stdout gcs;
    error_log  /dev/stderr warn;

    # Rate limits per client address, the cheap first line. The API keeps its own, finer limits (per user, per
    # command); these stop a flood before it reaches .NET at all.
    #   gcs_api:  20 requests/s sustained, bursts up to 40 (a desktop client polling a few endpoints stays far below)
    #   gcs_auth: 10 login/refresh attempts per minute, like the API's AuthPerMinute
    limit_req_zone  $binary_remote_addr zone=gcs_api:10m  rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=gcs_auth:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=gcs_conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # WebSocket: "Connection: upgrade" only when the client asked to upgrade; otherwise keep the upstream connection
    # alive for reuse ("" clears the header).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream gcs_api {
        server gcs-api:8080;
        keepalive 32;
    }

    include /etc/nginx/conf.d/gcs.conf;
}
