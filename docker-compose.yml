# Local development stack. Usage:
#   docker compose up -d --wait        # start everything and wait until healthy
#   docker compose down                # stop (data is kept in named volumes)
# Credentials come from .env (copy .env.example). The defaults below are for local development only.
# Ports are bound to 127.0.0.1 so the services are not exposed to the local network.

name: gcs

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 10s

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gcs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gcs_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-gcs}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gcs}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gcs_dev_password}
    ports:
      - "127.0.0.1:5672:5672"    # AMQP
      - "127.0.0.1:15672:15672"  # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]

  # Not used by the API yet. Redis is introduced in Phase 4 as the latest-vehicle-state cache (see docs/adr).
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]

  # Traces, metrics and logs from the API over OpenTelemetry (OTLP). UI: http://localhost:18888
  # Anonymous access is acceptable only because the port is bound to 127.0.0.1 (see docs/observability.md).
  otel-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    restart: unless-stopped
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"  # dashboard UI
      - "127.0.0.1:4317:18889"   # OTLP/gRPC, for an API started with dotnet run on the host

  # Applies database migrations once, then exits. The API starts only after it finished successfully.
  gcs-migrator:
    build:
      context: .
      dockerfile: docker/Gcs.Migrator.Dockerfile
    image: gcs-migrator:local
    restart: "no"
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-gcs};Username=${POSTGRES_USER:-gcs};Password=${POSTGRES_PASSWORD:-gcs_dev_password}
    depends_on:
      postgres:
        condition: service_healthy

  gcs-api:
    build:
      context: .
      dockerfile: docker/Gcs.Api.Dockerfile
    image: gcs-api:local
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-gcs};Username=${POSTGRES_USER:-gcs};Password=${POSTGRES_PASSWORD:-gcs_dev_password}
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-gcs}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-gcs_dev_password}
      # Secrets, never defaults: compose refuses to start without a signing key (see .env.example).
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env, e.g. openssl rand -base64 48}
      # Creates the first administrator while no user exists; ignored afterwards.
      Security__BootstrapAdministrator__Username: ${GCS_ADMIN_USERNAME:-admin}
      Security__BootstrapAdministrator__Password: ${GCS_ADMIN_PASSWORD:-}
      Observability__OtlpEndpoint: http://otel-dashboard:18889
    ports:
      - "127.0.0.1:8080:8080"
      # MAVLink from vehicles/SITL on the host. Register a vehicle with transport Udp, host 0.0.0.0, port 14550.
      - "127.0.0.1:14550:14550/udp"
      # MAVLink from PX4 SITL (Phase 10). Register it with transport Udp, host 0.0.0.0, port 14560, system id 10.
      - "127.0.0.1:14560:14560/udp"
    depends_on:
      gcs-migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      otel-dashboard:
        condition: service_started
    healthcheck:
      <<: *healthcheck-defaults
      # The aspnet base image has no curl; bash's /dev/tcp is enough for a plain HTTP probe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]

  # A simulated PX4 quad that sends MAVLink to the API over UDP, standing in for PX4 SITL.
  # To see it in the GCS: register a vehicle (system id 1, transport Udp, host 0.0.0.0, port 14550) and connect it.
  gcs-simulator:
    build:
      context: .
      dockerfile: docker/Gcs.Simulation.Dockerfile
    image: gcs-simulator:local
    restart: unless-stopped
    environment:
      Simulator__GcsHost: gcs-api
      Simulator__GcsPort: "14550"
      Simulator__SystemId: "1"
      # A SiK-style telemetry radio next to it (RADIO_STATUS), so the link quality line shows RSSI (Phase 12).
      Simulator__SimulateRadio: "true"
    depends_on:
      gcs-api:
        condition: service_started

  # A real PX4 autopilot: PX4 SITL with SIH physics, headless (no Gazebo, no display). Opt-in, because it is a
  # second vehicle and most work does not need it:
  #   docker compose --profile sitl up -d --wait
  # See docs/px4-sitl.md. It sends MAVLink to gcs-api:14560/udp as system id 10 (the gcs-simulator is system 1).
  px4-sitl:
    profiles: ["sitl"]
    build:
      context: docker/px4-sitl
    image: gcs-px4-sitl:local
    restart: unless-stopped
    environment:
      GCS_HOST: gcs-api
      GCS_PORT: "14560"
      PX4_PARAM_MAV_SYS_ID: "10"
      # Same home as the built-in simulator (Ankara), so both vehicles show up on the same map.
      PX4_HOME_LAT: "39.925533"
      PX4_HOME_LON: "32.866287"
      PX4_HOME_ALT: "938"
    depends_on:
      gcs-api:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
